<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 280" role="img" aria-labelledby="title desc"><title id="title">A truth table and its rule</title><desc id="desc">Four rows define the Boolean XOR function. The output equals one exactly when the two input bits differ.</desc><rect x="0" y="0" width="480" height="280" rx="0" fill="#e1eff1" stroke="none" stroke-width="1"/><defs><pattern id="dots" width="14" height="14" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r=".83" fill="#C2C1A7"/></pattern></defs><rect x="0" y="0" width="480" height="280" rx="0" fill="none" stroke="none" stroke-width="1"/><rect x="48" y="40" width="145" height="200" rx="8" fill="#eaf0f4" stroke="#234f60" stroke-width="2"/><rect x="49" y="41" width="143" height="38" rx="6" fill="#234f60" stroke="none" stroke-width="0"/><text x="76" y="67" text-anchor="middle" font-family="monospace" font-size="18" font-weight="500" fill="#eaf0f4">a</text><text x="123" y="67" text-anchor="middle" font-family="monospace" font-size="18" font-weight="500" fill="#eaf0f4">b</text><text x="170" y="67" text-anchor="middle" font-family="monospace" font-size="18" font-weight="500" fill="#eaf0f4">y</text><text x="76" y="107" text-anchor="middle" font-family="monospace" font-size="19" font-weight="500" fill="#234f60">0</text><text x="123" y="107" text-anchor="middle" font-family="monospace" font-size="19" font-weight="500" fill="#234f60">0</text><text x="170" y="107" text-anchor="middle" font-family="monospace" font-size="19" font-weight="500" fill="#266981">0</text><line x1="59" y1="120" x2="181" y2="120" stroke="#bdd1d6" stroke-width="1" stroke-linecap="round" /><text x="76" y="145" text-anchor="middle" font-family="monospace" font-size="19" font-weight="500" fill="#234f60">0</text><text x="123" y="145" text-anchor="middle" font-family="monospace" font-size="19" font-weight="500" fill="#234f60">1</text><text x="170" y="145" text-anchor="middle" font-family="monospace" font-size="19" font-weight="500" fill="#266981">1</text><line x1="59" y1="158" x2="181" y2="158" stroke="#bdd1d6" stroke-width="1" stroke-linecap="round" /><text x="76" y="183" text-anchor="middle" font-family="monospace" font-size="19" font-weight="500" fill="#234f60">1</text><text x="123" y="183" text-anchor="middle" font-family="monospace" font-size="19" font-weight="500" fill="#234f60">0</text><text x="170" y="183" text-anchor="middle" font-family="monospace" font-size="19" font-weight="500" fill="#266981">1</text><line x1="59" y1="196" x2="181" y2="196" stroke="#bdd1d6" stroke-width="1" stroke-linecap="round" /><text x="76" y="221" text-anchor="middle" font-family="monospace" font-size="19" font-weight="500" fill="#234f60">1</text><text x="123" y="221" text-anchor="middle" font-family="monospace" font-size="19" font-weight="500" fill="#234f60">1</text><text x="170" y="221" text-anchor="middle" font-family="monospace" font-size="19" font-weight="500" fill="#266981">0</text><line x1="204" y1="140" x2="251" y2="140" stroke="#266981" stroke-width="3" stroke-linecap="round" /><path d="M 244 131 L 253 140 L 244 149" fill="none" stroke="#266981" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><rect x="271" y="94" width="152" height="88" rx="8" fill="#266981" stroke="#234f60" stroke-width="2"/><text x="347" y="146" text-anchor="middle" font-family="monospace" font-size="23" font-weight="500" fill="#eaf0f4">a XOR b</text></svg>
